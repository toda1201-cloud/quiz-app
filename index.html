<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一般常識クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- スタート画面 -->
    <section id="start-screen" class="screen">
      <h1>一般常識クイズ</h1>
      <p class="lead">全10問・4択形式のクイズです。<br>何問正解できるか挑戦してみましょう！</p>
      <button id="start-btn" class="primary-btn" type="button">スタート</button>
    </section>

    <!-- 出題画面 -->
    <section id="quiz-screen" class="screen hidden">
      <div class="progress">
        <span id="progress-text">第1問 / 10問</span>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
      <h2 id="question-text" class="question"></h2>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback hidden" aria-live="polite"></div>
      <button id="next-btn" class="primary-btn hidden" type="button">次の問題へ</button>
    </section>

    <!-- 結果画面 -->
    <section id="result-screen" class="screen hidden">
      <h2>結果発表</h2>
      <p id="score-text" class="score"></p>
      <p id="result-message" class="lead"></p>
      <button id="retry-btn" class="primary-btn" type="button">もう一度挑戦する</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
